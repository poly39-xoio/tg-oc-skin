  <script>
  /* OC skin v8: 執行期清除大面積近黑背景(Telegram 帳號主題/桌布殘留) */
  (function () {
    function lum(r, g, b) { return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
    function fix() {
      var els = document.querySelectorAll('div,section,main,aside,header,footer,article');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var r = el.getBoundingClientRect();
        if (r.width * r.height < 40000) continue;
        // 跳過有文字內容的元件(訊息氣泡),只處理純背景圖層
        if ((el.textContent || '').trim().length > 40) continue;
        if (el.closest && el.closest('[class*="message-content"]')) continue;
        var cs = getComputedStyle(el);
        var m = /rgba?\((\d+), (\d+), (\d+)/.exec(cs.backgroundColor);
        var big = (r.width * r.height) > (window.innerWidth * window.innerHeight * 0.55);
        if (m && (lum(+m[1], +m[2], +m[3]) < 45 || (big && lum(+m[1], +m[2], +m[3]) < 95))) {
          el.style.setProperty('background-color', 'transparent', 'important');
          el.style.setProperty('background-image', 'none', 'important');
        }
      }
      document.documentElement.style.setProperty('background', 'linear-gradient(180deg,#8A9BA8 0%,#7C8D9A 45%,#6B7A87 100%)', 'important');
      document.body.style.setProperty('background', 'transparent', 'important');
    }
    var n = 0;
    var t = setInterval(function () { fix(); if (++n > 40) clearInterval(t); }, 500);
    document.addEventListener('DOMContentLoaded', fix);
    window.addEventListener('load', fix);
  })();
  </script>
