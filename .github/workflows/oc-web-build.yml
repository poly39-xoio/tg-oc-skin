name: OC Web Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build:production
      - name: Show size
        run: du -sh dist && ls dist | head
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
